<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Small-size master for Relay's application icon (16px-48px renders).

    The 1024px master in icon.svg loses its mark below ~64px: its 72px strokes
    fall under 1.2 device pixels at 16px, and its drop shadow darkens the tile
    until the cream mark disappears. This variant keeps the same glyph and
    palette but drops the shadow, flattens the background to a mid tone, and
    thickens every element so the branch shape still reads at 16px.

    Keep both files in step when the mark changes. build/generate-icons.mjs
    chooses between them per rendered size.
  -->
  <rect x="20" y="20" width="984" height="984" rx="228" fill="#1d5f45"/>
  <path d="M338 296v432M338 430h176c96 0 174 78 174 174v124" fill="none" stroke="#f7f2e2" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="338" cy="296" r="94" fill="#ef8a4c"/>
  <circle cx="338" cy="728" r="94" fill="#7cc199"/>
  <circle cx="688" cy="728" r="94" fill="#ef8a4c"/>
</svg>
