name: Native desktop validation

on:
  workflow_dispatch:
  # A version tag builds, tests and packages every platform, then the
  # release job publishes the installers (a prerelease for a suffixed tag
  # such as v0.6.1-rc1).
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'native/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }} / Qt 6.11.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-debug
            runner: macos-15
            qt-host: mac
            qt-arch: clang_64
          - target: windows-debug
            runner: windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - target: linux-debug
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.2
      # CMake 3.31 supports C++26 with upstream clang++'s GNU frontend,
      # but not with AppleClang, cl.exe, or clang-cl. Keep the real C++26
      # requirement; the presets select clang++ explicitly on both targets.
      - name: Install macOS LLVM
        if: runner.os == 'macOS'
        run: brew install llvm@20
      # clang-20 comes from the Ubuntu archive, or from apt.llvm.org if the
      # runner image's archive no longer carries it. The Qt SDK needs the
      # OpenGL and xkbcommon headers; the rest runs the tests and the
      # installed application (X11 platform plugin, keyring, menu entry).
      - name: Install Linux compiler and libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y clang-20; then
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            echo 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm-20.list
            sudo apt-get update
            sudo apt-get install -y clang-20
          fi
          sudo apt-get install -y g++ pkg-config libsecret-1-dev libgl-dev libxkbcommon-dev \
            libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            dbus-daemon gnome-keyring xvfb desktop-file-utils
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Windows'
        with:
          version: '6.11.1'
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python native/tools/install_ci_qt_windows.py
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      # clang++ uses the MSVC target, SDK, STL, and dynamic CRT, matching
      # the official Qt MSVC binaries; it does not use the MinGW ABI.
      # windows-2025 currently includes upstream LLVM 20.1.8.
      - name: Record Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:ProgramFiles/LLVM/bin/clang++.exe" --version'
      - name: Record macOS compiler
        if: runner.os == 'macOS'
        run: /opt/homebrew/opt/llvm@20/bin/clang++ --version
      - name: Record Linux compiler
        if: runner.os == 'Linux'
        run: clang++-20 --version
      - name: Configure
        shell: bash
        run: cmake --preset "${{ matrix.target }}" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --parallel 3
      - name: Deploy Windows test runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $build = Join-Path $PWD 'build-native/windows-debug'
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --debug --compiler-runtime --no-translations --dir $build "$build/Relay.exe" "$build/tst_main_window.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ucrt = Join-Path $env:WindowsSdkDir "bin/$($env:WindowsSDKVersion.TrimEnd('\'))/x64/ucrt/ucrtbased.dll"
          if (!(Test-Path $ucrt)) { throw "Missing SDK debug runtime: $ucrt" }
          Copy-Item $ucrt $build
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreend.dll" "$build/platforms/"
          "QT_QPA_FONTDIR=$env:WINDIR/Fonts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & mt.exe "-inputresource:$build/tst_domain.exe;#1" "-out:$build/test.manifest"
          Get-Content "$build/test.manifest"
          try { & "$build/tst_domain.exe" -functions }
          catch {
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='SideBySide'} -MaxEvents 3 | Format-List Message
            throw
          }
          if ($LASTEXITCODE -ne 0) { throw "Windows test launch failed: $LASTEXITCODE" }
      # Defender scans every git.exe the Git fixtures start, which dominated the
      # Windows test time. This affects only the disposable runner VM.
      - name: Disable real-time scanning on the runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # Suites use their own temporary repositories and profiles, so they run
      # side by side; wall time is then about the longest suite.
      - name: Test
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          RELAY_SCREENSHOT_DIR: ${{ github.workspace }}/build-native/screenshots
        run: ctest --preset ${{ matrix.target }} --timeout 60 --parallel 4
      # The keyring test needs a session bus and an unlocked Secret Service;
      # both live only for this step, with a throwaway password.
      - name: Test (Linux, with a disposable keyring)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          RELAY_SCREENSHOT_DIR: ${{ github.workspace }}/build-native/screenshots
          RELAY_TEST_SECRET_SERVICE: '1'
        run: |
          dbus-run-session -- bash -c '
            set -e
            echo relay-ci-keyring | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ctest --preset linux-debug --timeout 60 --parallel 4'
      # Pinned versions and SHA-256 digests live in native/packaging/runtimes.json.
      - name: Fetch bundled Git and GitHub CLI
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) platform=win-x64 ;; macOS) platform=mac-arm64 ;; *) platform=linux-x64 ;; esac
          python native/tools/fetch_runtimes.py --platform "$platform" --output "$RUNNER_TEMP/relay-runtimes"
      - name: Validate Apple Silicon installer
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          bash native/tools/install-macos.sh --source "$GITHUB_WORKSPACE" --qt-dir "$QT_ROOT_DIR" --runtimes "$RUNNER_TEMP/relay-runtimes" --no-open
          "$HOME/Applications/Relay Native.app/Contents/Resources/gh/gh" --version
          /usr/bin/open -W "$HOME/Applications/Relay Native.app" --args --smoke-test
          ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/Relay Native.app" build-native/Relay-Native-macos-arm64.zip
      - name: Validate Windows source installer
        id: windows-install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./native/tools/install-windows.ps1 -Source $PWD -QtDir $env:QT_ROOT_DIR -Runtimes "$env:RUNNER_TEMP/relay-runtimes" -NoOpen
          $app = "$env:LOCALAPPDATA/Programs/Relay Native"
          # The bundled tools must work on their own, from the installed location.
          & "$app/resources/gh/gh.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled gh failed' }
          & "$app/resources/git/cmd/git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled git failed' }
          & "$app/resources/git/cmd/git.exe" ls-remote https://github.com/ka-capek/relay-desktop.git HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Bundled git could not reach GitHub over HTTPS' }
          "app_dir=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # Builds the release payload, installs it for the runner user, then
      # checks the installed copy and the packaged archive on an X server.
      - name: Validate Linux source installer and archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^  VERSION \(.*\)$/\1/p' CMakeLists.txt)
          bash native/tools/install-linux.sh --source "$GITHUB_WORKSPACE" --qt-dir "$QT_ROOT_DIR" \
            --runtimes "$RUNNER_TEMP/relay-runtimes" --compiler clang++-20 \
            --package "$PWD/build-native/preview-installers" --no-open
          app="$HOME/.local/share/relay-native"
          "$app/resources/gh/gh" --version
          desktop-file-validate "$HOME/.local/share/applications/dev.relay.gitclient.desktop"
          env -u QT_QPA_PLATFORM xvfb-run -a "$app/Relay" --smoke-test
          mkdir "$RUNNER_TEMP/relay-archive"
          tar -xzf "build-native/preview-installers/Relay-Native-$version-linux-x64.tar.gz" -C "$RUNNER_TEMP/relay-archive"
          env -u QT_QPA_PLATFORM xvfb-run -a "$RUNNER_TEMP/relay-archive/relay-native/Relay" --smoke-test
          XDG_DATA_HOME="$RUNNER_TEMP/relay-data" bash "$RUNNER_TEMP/relay-archive/relay-native/install.sh" --no-open
          env -u QT_QPA_PLATFORM xvfb-run -a "$RUNNER_TEMP/relay-data/relay-native/Relay" --smoke-test
      - name: Package and verify macOS preview DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^  VERSION \(.*\)$/\1/p' CMakeLists.txt)
          bash native/tools/build-preview-dmg.sh "$HOME/Applications/Relay Native.app" "$version" "$PWD/build-native/preview-installers"
          mkdir -p "$RUNNER_TEMP/relay-dmg"
          hdiutil attach "build-native/preview-installers/Relay-Native-$version-arm64.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/relay-dmg"
          ditto "$RUNNER_TEMP/relay-dmg/Relay Native.app" "$RUNNER_TEMP/Relay Native.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Relay Native.app"
          open -W "$RUNNER_TEMP/Relay Native.app" --args --smoke-test
          hdiutil detach "$RUNNER_TEMP/relay-dmg"
      - name: Package and test Windows preview installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on the Windows runner' }
          $version = (Select-String -Path CMakeLists.txt -Pattern '^  VERSION (.+)$').Matches.Groups[1].Value
          ./native/tools/test-preview-windows.ps1 -Compiler $compiler -Payload '${{ steps.windows-install.outputs.app_dir }}' -Version $version -Output "$PWD/build-native/preview-installers"
      - name: Upload preview installers
        uses: actions/upload-artifact@v4
        with:
          name: Relay-Native-${{ matrix.target }}-installers
          path: |
            build-native/preview-installers/*.exe
            build-native/preview-installers/*.dmg
            build-native/preview-installers/*.tar.gz
          if-no-files-found: error
      - name: Upload macOS source build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Relay-Native-macos-arm64-source-build
          path: build-native/Relay-Native-macos-arm64.zip
          if-no-files-found: error
      - name: Upload Windows source build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Relay-Native-windows-x64-source-build
          path: ${{ steps.windows-install.outputs.app_dir }}
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-diagnostics
          path: |
            build-native/${{ matrix.target }}/Testing/Temporary/
            build-native/${{ matrix.target }}/native/tests/*.txt
            build-native/screenshots/
            build-native/preview-installers/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the project version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^  VERSION \(.*\)$/\1/p' CMakeLists.txt)
          if [ "v$version" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: Relay-Native-*-installers
          path: release
          merge-multiple: true
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          dmg="Relay-Native-$VERSION-arm64.dmg"
          exe="Relay-Native-Setup-$VERSION-x64.exe"
          linux="Relay-Native-$VERSION-linux-x64.tar.gz"
          for file in "$dmg" "$exe" "$linux"; do
            [ -f "$file" ] || { echo "Missing installer $file" >&2; ls -l >&2; exit 1; }
          done
          sha256sum "$dmg" "$exe" "$linux" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          kind=(--latest)
          case "$GITHUB_REF_NAME" in *-*) kind=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$dmg" "$exe" "$linux" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" \
            --title "Relay $VERSION" --generate-notes \
            --notes "The installers are not Developer ID signed, notarized or Authenticode signed. The Windows setup includes Git for Windows and the GitHub CLI; on macOS, Git comes from the Xcode Command Line Tools or Homebrew. The Linux archive (x86_64, glibc 2.39 or newer) includes the GitHub CLI and uses the distribution's Git; extract it and run install.sh."
